  <g font-family="DejaVu Sans Mono, monospace" font-size="27" font-weight="700" text-anchor="middle" fill="#E8FFF8">
    <g><rect x="64" y="110" width="48" height="58" rx="8" fill="#0A2925" stroke="#66F2D5" stroke-width="2"/><text x="88" y="148">T</text></g>
