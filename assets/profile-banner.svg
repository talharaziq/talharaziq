  <!-- RAZIQ -->
    <g><rect x="354" y="110" width="48" height="58" rx="8" fill="#0A2925" stroke="#66F2D5" stroke-width="2"/><text x="378" y="148">R</text></g>
    <g><rect x="410" y="110" width="48" height="58" rx="8" fill="#0A2925" stroke="#66F2D5" stroke-width="2"/><text x="434" y="148">A</text></g>
    <g><rect x="466" y="110" width="48" height="58" rx="8" fill="#0A2925" stroke="#66F2D5" stroke-width="2"/><text x="490" y="148">Z</text></g>
    <g><rect x="522" y="110" width="48" height="58" rx="8" fill="#0A2925" stroke="#66F2D5" stroke-width="2"/><text x="546" y="148">I</text></g>
    <g><rect x="578" y="110" width="48" height="58" rx="8" fill="#0A2925" stroke="#66F2D5" stroke-width="2"/><text x="602" y="148">Q</text></g>
  </g>
  <path d="M64 189H150" stroke="url(#mint)" stroke-width="4" stroke-linecap="round"/>
  <text x="64" y="224" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#D8F8EB">BIOINFORMATICS <tspan fill="#66F2D5">/</tspan> COMPUTATIONAL BIOLOGY</text>
  <text x="64" y="253" font-size="15" fill="#A7BBC0">Biology is the language. Data is the lens.</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="10" font-weight="700" letter-spacing=".8">
    <rect x="64" y="276" width="112" height="28" rx="6" fill="#0C2824" stroke="#347D68"/><text x="77" y="294" fill="#80ECCD">GENOMICS</text>
    <rect x="186" y="276" width="220" height="28" rx="6" fill="#0C2824" stroke="#347D68"/><text x="199" y="294" fill="#80ECCD">STRUCTURAL BIOINFORMATICS</text>
    <rect x="416" y="276" width="166" height="28" rx="6" fill="#0C2824" stroke="#347D68"/><text x="429" y="294" fill="#80ECCD">MACHINE LEARNING</text>
